<!DOCTYPE html>
<html>
<head>
    <title>SSE Test</title>
</head>
<body>
    <h1>SSE Connection Test</h1>
    <div id="status">Connecting...</div>
    <div id="messages"></div>
    
    <script>
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        
        function addMessage(message) {
            const div = document.createElement('div');
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            messagesDiv.appendChild(div);
        }
        
        // First create a session to test with
        async function createTestSession() {
            try {
                addMessage('Creating test session...');
                const response = await fetch('http://localhost:3000/planning-poker/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'ownerName=TestOwner&sessionName=SSE Test&description=Testing SSE'
                });
                
                if (response.ok) {
                    const url = response.url;
                    const sessionCode = url.match(/\/session\/([A-Z0-9]+)/)?.[1];
                    addMessage(`Session created: ${sessionCode}`);
                    
                    if (sessionCode) {
                        // Join the session
                        addMessage('Joining session...');
                        const joinResponse = await fetch('http://localhost:3000/planning-poker/join', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: `participantName=TestParticipant&sessionCode=${sessionCode}`
                        });
                        
                        if (joinResponse.ok) {
                            const joinUrl = joinResponse.url;
                            const participantId = joinUrl.match(/participantId=([^&]+)/)?.[1];
                            addMessage(`Joined session, participantId: ${participantId}`);
                            
                            // Now test SSE connection
                            testSSEConnection(sessionCode, participantId);
                        } else {
                            addMessage(`Failed to join session: ${joinResponse.status}`);
                        }
                    }
                } else {
                    addMessage(`Failed to create session: ${response.status}`);
                }
            } catch (error) {
                addMessage(`Error: ${error.message}`);
            }
        }
        
        function testSSEConnection(sessionCode, participantId) {
            addMessage(`Testing SSE connection to: /planning-poker/sse/${sessionCode}`);
            
            const eventSource = new EventSource(`http://localhost:3000/planning-poker/sse/${sessionCode}`);
            
            eventSource.onopen = () => {
                statusDiv.textContent = 'SSE Connected ✅';
                addMessage('SSE connection opened successfully!');
            };
            
            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    addMessage(`SSE Message received: ${JSON.stringify(data, null, 2)}`);
                } catch (e) {
                    addMessage(`Raw SSE Message: ${event.data}`);
                }
            };
            
            eventSource.onerror = (error) => {
                statusDiv.textContent = 'SSE Error ❌';
                addMessage(`SSE Error: ${error}`);
            };
            
            // Test vote submission after 3 seconds
            setTimeout(async () => {
                addMessage('Submitting test vote...');
                try {
                    const voteResponse = await fetch('http://localhost:3000/planning-poker/submit-vote', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sessionCode: sessionCode,
                            participantId: participantId,
                            vote: '8'
                        })
                    });
                    
                    if (voteResponse.ok) {
                        addMessage('Vote submitted - check for SSE update!');
                    } else {
                        addMessage(`Vote submission failed: ${voteResponse.status}`);
                    }
                } catch (error) {
                    addMessage(`Vote error: ${error.message}`);
                }
            }, 3000);
        }
        
        // Start the test
        createTestSession();
    </script>
</body>
</html>
